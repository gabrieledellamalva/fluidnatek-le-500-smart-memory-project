  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#5EEAD4"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
  <filter id="shadow" x="-20%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".22"/></filter>
</defs>
<rect width="1380" height="570" rx="28" fill="url(#bg)"/>
<circle cx="1290" cy="38" r="205" fill="#1D6C7E" opacity=".13"/><circle cx="65" cy="540" r="240" fill="#396EAB" opacity=".12"/>
<text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="4" font-weight="700" fill="#5EEAD4">FLUIDNATEK / ENGINEERING WORKFLOW</text>
<text x="48" y="115" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" fill="#F2F8FF">Experimental knowledge → evidence-based decisions</text>
<text x="48" y="148" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#A9C2D4">Local-first application · typed data · deterministic historical analysis</text>
